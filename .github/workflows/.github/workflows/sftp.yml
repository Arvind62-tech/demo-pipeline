name: EC2 File Transfer

on:
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Pull file from EC2-1
        run: |
          scp -i ~/.ssh/id_rsa ubuntu@EC2_1_IP:/home/ubuntu/test.txt .

      - name: Send file to EC2-2
        run: |
          sftp -i ~/.ssh/id_rsa ubuntu@EC2_2_IP <<EOF
          put test.txt
          bye
          EOF
